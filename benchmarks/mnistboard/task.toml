schema_version = "1.2"

[task]
name = "agent-collab/mnistboard"
description = "Build the smallest compressed solver that reaches >=99.4% accuracy on MNIST."
keywords = ["agent-collab", "mnistboard", "mnist", "compression", "efficiency"]

[[task.authors]]
name = "agent-collab"

[environment]
build_timeout_sec = 3600
cpus = 3
memory_mb = 8192
storage_mb = 20480
network_mode = "public"
workdir = "/app"

[agent]
timeout_sec = 345600

[verifier]
timeout_sec = 1800
